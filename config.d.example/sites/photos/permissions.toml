# Photos Site Permissions Configuration
#
# Restricted to authenticated users only

# No public access
public_role = "none"

# Default role for authenticated users
default_authenticated_role = "viewer"

[roles.viewer]
[roles.viewer.permissions]
can_view = true
can_see_technical_details = true
can_download_medium = true
can_download_large = true
can_use_zoom = true

[roles.owner]
[roles.owner.permissions]
owner_access = true

[[user_roles]]
username = "photographer"
roles = ["owner"]

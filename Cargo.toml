[workspace]
resolver = "2"
members = [
    "tenrankai",
    "tenrankai-storage",
    "tenrankai-users",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/theatrus/tenrankai"

[workspace.dependencies]
# Shared dependencies with consistent versions
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml_edit = { version = "0.23", features = ["serde"] }
tracing = "0.1"
url = "2.5"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2.5"

# AWS SDKs
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-sesv2 = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "uuid", "chrono"] }

# WebAuthn
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

# Internal crates
tenrankai-storage = { path = "tenrankai-storage" }
tenrankai-users = { path = "tenrankai-users" }

[profile.dev]
opt-level = 2
debug = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256

[workspace]
resolver = "2"
members = [
    "tenrankai",
    "tenrankai-config-storage",
    "tenrankai-email",
    "tenrankai-image",
    "tenrankai-metadata",
    "tenrankai-storage",
    "tenrankai-users",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/theatrus/tenrankai"

[workspace.dependencies]
# Shared dependencies with consistent versions
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml_edit = { version = "0.24", features = ["serde"] }
tracing = "0.1"
url = "2.5"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2.5"

# AWS SDKs
aws-config = "1"
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-sesv2 = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "uuid", "chrono"] }

# WebAuthn
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
httpdate = "1.0"

# Templating
liquid = "0.26"
liquid-core = "0.26"

# Image processing
image = "0.25"
imageproc = "0.26"
ab_glyph = "0.2"
resvg = "0.47"
usvg = "0.47"
ico = "0.5"
webp = { version = "0.3", features = ["img"] }
libwebp-sys = "0.14"
libavif = { git = "https://github.com/theatrus/libavif-rs", branch = "new-libavif", features = ["codec-aom"] }
libavif-sys = { git = "https://github.com/theatrus/libavif-rs", branch = "new-libavif", features = ["codec-aom"] }
libheif-rs = "2.7"
rgb = "0.8"

# EXIF and metadata
rexif = "0.7"
quick-xml = "0.39"

# Markdown
pulldown-cmark = "0.13"

# Crypto and encoding
hmac = "0.12"
sha2 = "0.10"
flate2 = "1.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Utilities
mime_guess = "2.0"
rand = "0.9"
fnv = "1.0"
lru = "0.16"
zip = { version = "8", default-features = false, features = ["deflate"] }
num_cpus = "1.16"

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
env_logger = "0.11"

# Testing
axum-test = "18.7"
regex = "1"

# Internal crates
tenrankai-config-storage = { path = "tenrankai-config-storage" }
tenrankai-email = { path = "tenrankai-email" }
tenrankai-image = { path = "tenrankai-image" }
tenrankai-metadata = { path = "tenrankai-metadata" }
tenrankai-storage = { path = "tenrankai-storage" }
tenrankai-users = { path = "tenrankai-users" }

[profile.dev]
opt-level = 2
debug = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256

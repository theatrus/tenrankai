[package]
name = "tenrankai-config-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable configuration storage for Tenrankai admin"

[features]
default = []
dynamodb = ["dep:aws-sdk-dynamodb", "dep:aws-config", "dep:uuid"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml_edit.workspace = true
tracing.workspace = true
urlencoding.workspace = true

# For Storage trait adapter
tenrankai-storage.workspace = true

# For file locking
fs2 = "0.4"

# DynamoDB backend (optional)
[dependencies.aws-sdk-dynamodb]
workspace = true
optional = true

[dependencies.aws-config]
workspace = true
optional = true

[dependencies.uuid]
workspace = true
optional = true
features = ["v4"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }

name: CI
#
# Platform-specific build configuration:
# - Ubuntu/macOS: Full build with AVIF and HEIF support (default features)
# - Windows: Build without AVIF/HEIF support (--no-default-features) for easier builds

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  AOM_VERSION: v3.12.1
  AOM_COMMIT: 10aece4157eb79315da205f39e19bf6ab3ee30d0
  # Fetch git dependencies (libavif/libavif-sys) with the system git CLI instead
  # of libgit2. Avoids intermittent macOS "SecureTransport error: connection
  # closed via error" failures from the libgit2 fetch backend.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        # No longer using rust matrix - version specified in rust-toolchain.toml
    steps:
    - name: Free disk space (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        # Remove large unused packages to free disk space
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - uses: actions/checkout@v7

    - name: Install build dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        # Build tools for AVIF
        sudo apt-get install -y nasm ninja-build meson cmake pkg-config
        # libheif dependencies
        sudo apt-get install -y libde265-dev libx265-dev libaom-dev
        # Build libheif from source (need >= 1.21 for libheif-rs)
        git clone --depth 1 --branch v1.21.1 https://github.com/strukturag/libheif.git /tmp/libheif
        cd /tmp/libheif
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_EXAMPLES=OFF
        make -j$(nproc)
        sudo make install
        sudo ldconfig
        # Clean up build directory to save space
        rm -rf /tmp/libheif

    - name: Install build dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install nasm meson libheif

    - name: Cache AOM source
      if: matrix.os != 'windows-latest'
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/aom/${{ env.AOM_VERSION }}
        key: ${{ runner.os }}-aom-source-${{ env.AOM_VERSION }}-${{ env.AOM_COMMIT }}

    - name: Prepare AOM source for libavif
      if: matrix.os != 'windows-latest'
      run: |
        AOM_SOURCE_DIR="${RUNNER_TOOL_CACHE}/aom/${AOM_VERSION}"

        if [ ! -f "${AOM_SOURCE_DIR}/CMakeLists.txt" ]; then
          rm -rf "${AOM_SOURCE_DIR}"
          git clone --depth 1 --branch "${AOM_VERSION}" https://aomedia.googlesource.com/aom "${AOM_SOURCE_DIR}"
        fi
        test "$(git -C "${AOM_SOURCE_DIR}" rev-parse HEAD)" = "${AOM_COMMIT}"

        echo "AOM_SOURCE_DIR=${AOM_SOURCE_DIR}" >> "${GITHUB_ENV}"
        echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/.github/cmake/aom-fetchcontent-cache.cmake" >> "${GITHUB_ENV}"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Install admin npm dependencies
      run: cd admin && npm ci

    - name: Run frontend linting (TypeScript, CSS, CSS variables)
      run: npm run lint

    - name: Run frontend tests
      run: npm test

    - name: Build frontend
      run: npm run build

    - name: Install build dependencies (Windows - no AVIF/HEIF)
      if: matrix.os == 'windows-latest'
      run: |
        # Install OpenSSL via vcpkg (AVIF/HEIF not needed since we build with --no-default-features)
        vcpkg install openssl:x64-windows-static

        # Set up OpenSSL environment variables
        echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "OPENSSL_LIB_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "OPENSSL_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: powershell

    - name: Install Rust (use rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@stable
      # Note: When rust-toolchain.toml is present, it takes precedence
      # The 'with' section is ignored when rust-toolchain.toml exists

    - name: Verify Rust version from toolchain file
      run: |
        echo "Using Rust version from rust-toolchain.toml:"
        rustc --version
        cargo --version

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy (Ubuntu/macOS)
      run: cargo clippy --workspace -- -D warnings
      if: matrix.os != 'windows-latest'

    - name: Run clippy (Windows - no AVIF/HEIF)
      run: cargo clippy --workspace --no-default-features -- -D warnings
      if: matrix.os == 'windows-latest'

    - name: Build (Ubuntu/macOS)
      if: matrix.os != 'windows-latest'
      run: cargo build --workspace --verbose

    - name: Build (Windows - no AVIF/HEIF)
      if: matrix.os == 'windows-latest'
      run: cargo build --workspace --verbose --no-default-features

    - name: Run tests (Ubuntu/macOS)
      if: matrix.os != 'windows-latest'
      run: cargo test --workspace --verbose

    - name: Run tests (Windows - no AVIF/HEIF)
      if: matrix.os == 'windows-latest'
      run: cargo test --workspace --verbose --no-default-features

  # End-to-end browser tests (gallery display + image ordering)
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Install admin npm dependencies
      run: cd admin && npm ci

    - name: Build frontend
      run: npm run build

    - name: Install Rust (use rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-e2e-target-${{ hashFiles('**/Cargo.lock') }}

    # E2E uses PNG fixtures only, so build without AVIF/HEIF to skip the heavy
    # system dependencies and keep the job fast.
    - name: Build server (no AVIF/HEIF)
      run: cargo build --no-default-features

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E tests
      run: npm run test:e2e

    - name: Upload Playwright artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-artifacts
        path: |
          e2e/screenshots/
          e2e/playwright-report/
          e2e/test-results/
        retention-days: 14
        if-no-files-found: ignore

  # Security audit
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install cargo-audit
      # --locked installs the versions from cargo-audit's own lockfile; without
      # it, cargo resolves transitive deps (e.g. kstring) to releases whose
      # MSRV outruns the runner's stable toolchain and the build fails.
      run: cargo install cargo-audit --locked

    - name: Run cargo audit
      run: cargo audit

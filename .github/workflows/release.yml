name: Release
#
# Platform-specific build configuration:
# - Linux/macOS: Full build with AVIF support (default features)
# - Windows: Build without AVIF support (--no-default-features) for easier builds

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos-m1, windows]
        include:
        - build: linux
          os: ubuntu-latest
          rust: stable
          target: x86_64-unknown-linux-gnu
          archive-name: tenrankai-linux-x86_64.tar.gz
        - build: macos-m1
          os: macos-latest
          rust: stable
          target: aarch64-apple-darwin
          archive-name: tenrankai-macos-aarch64.tar.gz
        - build: windows
          os: windows-latest
          rust: stable
          target: x86_64-pc-windows-msvc
          archive-name: tenrankai-windows-x86_64.zip

    steps:
    - uses: actions/checkout@v5

    - name: Install build dependencies (Ubuntu/Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm ninja-build meson

    - name: Install build dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install nasm meson

    - name: Install build dependencies (Windows - no AVIF)
      if: matrix.os == 'windows-latest'
      run: |
        # Install OpenSSL via vcpkg (no AVIF tools needed for --no-default-features)
        vcpkg install openssl:x64-windows-static

        # Set up OpenSSL environment variables
        echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "OPENSSL_LIB_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "OPENSSL_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: powershell

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        target: ${{ matrix.target }}

    - name: Build (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build (Windows - no AVIF)
      if: matrix.os == 'windows-latest'
      run: |
        cargo build --release --target ${{ matrix.target }} --no-default-features

    - name: Create archive (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir archive
        cp target/${{ matrix.target }}/release/tenrankai archive/
        cp README.md LICENSE archive/
        tar -czf ${{ matrix.archive-name }} -C archive .
      
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path archive
        Copy-Item -Path "target\${{ matrix.target }}\release\tenrankai.exe" -Destination "archive\"
        Copy-Item -Path "README.md", "LICENSE" -Destination "archive\"
        Compress-Archive -Path "archive\*" -DestinationPath "${{ matrix.archive-name }}"

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./${{ matrix.archive-name }}
        asset_name: ${{ matrix.archive-name }}
        asset_content_type: application/octet-stream

# ConfigStorage Mode Configuration Example
#
# This configuration demonstrates using ConfigStorage as the source for all site
# configurations. In this mode, config.toml only contains bootstrap settings
# (server, app, email, openai). All site-specific configuration is loaded from
# ConfigStorage.
#
# Benefits:
# - Dynamic site management via admin API
# - Sites can be added, modified, or removed without restarting
# - Configuration can be stored in filesystem or S3
# - Security: storage_prefix prevents path traversal attacks

# Global server configuration
[server]
host = "0.0.0.0"
port = 3000

# Global application configuration
[app]
name = "Tenrankai"
log_level = "info"
cookie_secret = "change-me-in-production-use-a-long-random-string"
# Base URL is now set per-site in ConfigStorage, but this is the default fallback
base_url = "https://example.com"

# Point to ConfigStorage location
# Options:
# - Local filesystem: "config.d"
# - S3 bucket: "s3://bucket-name/config-prefix?region=us-east-1"
config_storage = "config.d"

# Global email configuration (optional, shared across all sites)
# Sites can override email settings in their site.toml
# [email]
# from_address = "noreply@example.com"
# from_name = "Tenrankai"
# provider = "ses"
# region = "us-east-1"

# Optional: OpenAI configuration for AI features
# [openai]
# api_key = "sk-..."
# model = "gpt-4o"

# =============================================================================
# Note: No [sites], [[galleries]], or [[posts]] sections!
# =============================================================================
# In ConfigStorage mode, all site configurations are loaded from the path
# specified in config_storage above.
#
# See config.d.example/ for the ConfigStorage directory structure.

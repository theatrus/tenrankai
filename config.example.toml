# Tenrankai Configuration
#
# This file contains bootstrap configuration only. Site-specific settings
# (galleries, posts, templates, static files) are managed in ConfigStorage.
#
# Quick Start:
# 1. Copy this file to config.toml
# 2. Create a config.d directory: mkdir -p config.d/sites/default/galleries
# 3. Copy example site config: cp -r config.d.example/* config.d/
# 4. Run: cargo run -- serve

[server]
host = "127.0.0.1"
port = 3000

[app]
name = "Tenrankai"
log_level = "info"
# Change this in production - use a long random string
cookie_secret = "change-me-in-production-use-a-long-random-string"
# hosted_mode = true  # Hide infrastructure settings (storage paths, etc.) from admin UI

# ConfigStorage location (required)
# Options:
# - Local filesystem: "config.d" (relative) or "/etc/tenrankai/config" (absolute)
# - S3 bucket: "s3://bucket-name/prefix?region=us-east-1"
config_storage = "config.d"

# =============================================================================
# ConfigStorage Directory Structure
# =============================================================================
#
# config.d/
#   sites/
#     default/           # Site name (used as identifier)
#       site.toml        # Site settings: hostnames, templates, static_files, base_url
#       galleries/
#         main.toml      # Gallery config: source, cache, sizes, permissions
#         portfolio.toml # Additional gallery
#       posts/
#         blog.toml      # Posts config: source, templates, pagination
#       permissions.toml # Permissions overrides (optional)
#     photos/            # Another site
#       site.toml
#       galleries/
#         photos.toml
#
# See config.d.example/ for complete examples of all configuration files.

# =============================================================================
# Optional: Email Configuration
# =============================================================================
# Required when using authentication to send login links via email.
#
# [email]
# from_address = "noreply@your-domain.com"
# from_name = "Tenrankai"  # Optional: Name shown in the "From" field
# reply_to = "support@your-domain.com"  # Optional: Reply-to address
# provider = "ses"  # Options: "ses" for production, "null" for development/testing
#
# # Amazon SES configuration (when provider = "ses")
# # Optional: AWS region where SES is configured (defaults to AWS SDK default region)
# region = "us-east-1"
# # Optional: Specify AWS credentials explicitly
# # If not provided, the AWS SDK will use its default provider chain:
# # 1. Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION)
# # 2. AWS credentials file (~/.aws/credentials)
# # 3. IAM role credentials (for EC2, ECS, Lambda, etc.)
# # access_key_id = "your-access-key"
# # secret_access_key = "your-secret-key"
#
# # Null provider configuration (when provider = "null")
# # - Logs email content to console instead of sending
# # - Perfect for development and testing
# # - No additional configuration required

# =============================================================================
# Optional: OpenAI Configuration
# =============================================================================
# Enable AI-powered image analysis features.
#
# [openai]
# api_key = "sk-..."
# model = "gpt-4o"  # Default model for image analysis

# =============================================================================
# Optional: Cache Generation Queue
# =============================================================================
# Background processing for cache generation after move/copy operations.
# When enabled, moving or copying images queues cache regeneration in the
# background instead of blocking the request. Also cleans up orphaned cache
# files when images are moved.
#
# [cache_queue]
# enabled = true
# buffer_size = 1000  # Max queued items (default: 1000)
# concurrency = 4     # Parallel workers (default: number of CPUs)
